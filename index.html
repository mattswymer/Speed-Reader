<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reader Application</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --pivot-color: #ff0000; /* Default Red */
            --ui-gray: #333;
            --ui-light-gray: #666;
            --accent: #4a90e2;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Top: Text Input */
        #input-section {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #111;
            color: #ddd;
            border: 1px solid var(--ui-gray);
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            border-radius: 5px;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* Middle: Controls */
        #controls-section {
            width: 100%;
            max-width: 800px;
            background-color: #111;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--ui-gray);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input[type="color"], input[type="number"] {
            background: #222;
            color: white;
            border: 1px solid var(--ui-light-gray);
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        input[type="number"] {
            width: 70px;
            cursor: text;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }

        /* Slider Logic */
        .slider-container {
            flex-grow: 1;
            min-width: 250px;
            position: relative;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Visual trickery for double slider */
        .range-wrapper {
            position: relative;
            height: 30px;
        }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: absolute;
            top: 5px;
            left: 0;
            pointer-events: none; /* Let clicks pass through to handle layering */
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            pointer-events: auto; /* Re-enable pointer events for the thumb */
            margin-top: -6px;
            position: relative;
            z-index: 10;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--ui-light-gray);
            border-radius: 2px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .speed-display {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent);
            text-align: right;
        }

        /* Bottom: The Reader Display */
        #reader-container {
            width: 100%;
            max-width: 800px;
            height: 250px;
            border: 1px solid var(--ui-light-gray);
            background-color: black;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 4px;
        }

        /* The Reticle (Target Lines) */
        .reticle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-sizing: border-box;
        }

        /* Top and bottom target notch */
        .reticle::before, .reticle::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px; /* Thickness of the line */
            height: 30px; /* Length of the line */
            background-color: var(--ui-light-gray);
            opacity: 0.5;
        }
        .reticle::before { top: 20px; }
        .reticle::after { bottom: 20px; }

        /* Horizontal guidelines (optional visual enhancement) */
        .reticle-guides {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--ui-gray) 20%, transparent 45%, transparent 55%, var(--ui-gray) 80%, transparent 100%);
            transform: translateY(-50%);
        }

        /* The Word Grid - This is the magic for alignment */
        #word-display {
            display: grid;
            /* Three columns: Left Context, Pivot Letter, Right Context */
            grid-template-columns: 1fr auto 1fr; 
            align-items: center;
            width: 100%;
            font-size: 48px; /* Base size, adjusted by JS */
            user-select: none;
        }

        .w-left {
            text-align: right;
            color: var(--text-color);
        }

        .w-pivot {
            text-align: center;
            color: var(--pivot-color);
            font-weight: bold;
            padding: 0 1px; /* Slight breathing room */
        }

        .w-right {
            text-align: left;
            color: var(--text-color);
        }

        /* Action Buttons */
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 10px 30px;
            font-size: 16px;
            background-color: var(--ui-gray);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--ui-light-gray); }
        button.primary { background-color: var(--accent); }
        button.primary:hover { background-color: #357abd; }

    </style>
</head>
<body>

    <div id="input-section">
        <textarea id="sourceText" placeholder="Paste your text here to begin reading...">Eye fatigue while reading often comes from the constant, repetitive motion our eyes are forced to make across a static page or screen. Each line requires a sequence of small jumps called saccades, punctuated by brief stops where the brain processes text. Over long periods, this back-and-forth motion strains the eye muscles, dries the eyes, and increases cognitive load as readers repeatedly lose their place, reorient, and refocus. The result is familiar to many readers: headaches, blurred vision, reduced focus, and a gradual decline in reading efficiency the longer a session lasts.
When the words move instead of the eyes, much of that physical strain is reduced. Techniques such as rapid serial visual presentation (RSVP) keep the text centered in a fixed focal point, allowing the eyes to remain relatively still while the brain does the work of processing language. By eliminating constant saccades and regressions, readers expend less energy on eye movement and more on comprehension. This can feel surprisingly natural after a short adjustment period, as the visual system shifts from navigation to absorption.
This change in mechanics can also improve both reading speed and understanding. With fewer interruptions from line breaks, page turns, or rereading lost spots, readers maintain a more consistent rhythm and cognitive flow. The brain receives information in a steady stream, which can enhance pattern recognition and reduce mental friction. For many readers, especially those prone to fatigue or distraction, moving text creates a smoother, more sustainable reading experience that supports faster intake without sacrificing comprehension.</textarea>
    </div>

    <div id="controls-section">
        
        <div class="control-group">
            <label>Font</label>
            <select id="fontSelect">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="Tahoma, sans-serif">Tahoma</option>
                <option value="Impact, sans-serif">Impact</option>
            </select>
        </div>

        <div class="control-group">
            <label>Sentence Pause</label>
            <div class="flex-row">
                <select id="pauseMode">
                    <option value="relative">Relative (x)</option>
                    <option value="constant">Fixed (ms)</option>
                </select>
                <input type="number" id="pauseValue" value="2.0" step="0.1" min="0">
            </div>
        </div>

        <div class="control-group">
            <label>Text Color</label>
            <input type="color" id="textColor" value="#ffffff">
        </div>
        <div class="control-group">
            <label>Pivot Color</label>
            <input type="color" id="pivotColor" value="#ff0000">
        </div>

        <div class="slider-container">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <label>Speed (WPM)</label>
                <span class="speed-display" id="wpmDisplay">200 → 800 WPM</span>
            </div>
            
            <div class="range-wrapper">
                <input type="range" id="speedSlider" min="10" max="1000" value="200">
                <input type="range" id="endSpeedSlider" min="10" max="1000" value="800" style="display: block; opacity: 0.7;">
            </div>
        </div>

        <div class="toggle-container">
            <input type="checkbox" id="gradualToggle" checked>
            <label for="gradualToggle">Gradual Increase</label>
        </div>
    </div>

    <div id="reader-container">
        <div class="reticle"></div>
        <div class="reticle-guides"></div>
        
        <div id="word-display">
            <span class="w-left">Eye</span>
            <span class="w-pivot">F</span>
            <span class="w-right">atigue</span>
        </div>
    </div>

    <div class="actions">
        <button onclick="resetReader()">Reset</button>
        <button class="primary" id="playPauseBtn" onclick="togglePlay()">Start</button>
    </div>

    <script>
        // --- Configuration & DOM Elements ---
        const sourceText = document.getElementById('sourceText');
        const wordDisplay = document.getElementById('word-display');
        const wLeft = document.querySelector('.w-left');
        const wPivot = document.querySelector('.w-pivot');
        const wRight = document.querySelector('.w-right');
        const fontSelect = document.getElementById('fontSelect');
        const textColorInput = document.getElementById('textColor');
        const pivotColorInput = document.getElementById('pivotColor');
        const speedSlider = document.getElementById('speedSlider');
        const endSpeedSlider = document.getElementById('endSpeedSlider');
        const gradualToggle = document.getElementById('gradualToggle');
        const wpmDisplay = document.getElementById('wpmDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const pauseModeSelect = document.getElementById('pauseMode');
        const pauseValueInput = document.getElementById('pauseValue');

        // --- State Variables ---
        let words = [];
        let currentIndex = 0;
        let isPlaying = false;
        let timer = null;
        let isGradual = true; 

        // --- Event Listeners ---
        
        // Update Colors
        textColorInput.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--text-color', e.target.value);
        });
        pivotColorInput.addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--pivot-color', e.target.value);
        });

        // Update Font
        fontSelect.addEventListener('change', (e) => {
            wordDisplay.style.fontFamily = e.target.value;
        });

        // Toggle Gradual Mode
        gradualToggle.addEventListener('change', (e) => {
            isGradual = e.target.checked;
            if (isGradual) {
                endSpeedSlider.style.display = 'block';
            } else {
                endSpeedSlider.style.display = 'none';
            }
            updateWpmLabel();
        });

        // Pause Logic UI updates
        pauseModeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'relative') {
                pauseValueInput.value = "2.0";
                pauseValueInput.step = "0.1";
            } else {
                // Constant
                pauseValueInput.value = "500";
                pauseValueInput.step = "50";
            }
        });

        // Slider Updates
        speedSlider.addEventListener('input', updateWpmLabel);
        endSpeedSlider.addEventListener('input', updateWpmLabel);

        function updateWpmLabel() {
            if (isGradual) {
                wpmDisplay.innerText = `${speedSlider.value} → ${endSpeedSlider.value} WPM`;
            } else {
                wpmDisplay.innerText = `${speedSlider.value} WPM`;
            }
        }

        // --- Core Logic ---

        function processText() {
            const raw = sourceText.value;
            const cleaned = raw.replace(/[\r\n]+/g, " ");
            words = cleaned.split(' ').filter(w => w.length > 0);
        }

        function togglePlay() {
            if (isPlaying) {
                pause();
            } else {
                start();
            }
        }

        function start() {
            if (words.length === 0) processText();
            if (words.length === 0) return;
            
            if (currentIndex >= words.length) {
                currentIndex = 0;
            }

            isPlaying = true;
            playPauseBtn.innerText = "Pause";
            playPauseBtn.classList.remove('primary');
            
            runLoop();
        }

        function pause() {
            isPlaying = false;
            clearTimeout(timer);
            playPauseBtn.innerText = "Resume";
            playPauseBtn.classList.add('primary');
        }

        function resetReader() {
            pause();
            currentIndex = 0;
            processText();
            if(words.length > 0) renderWord(words[0]);
            playPauseBtn.innerText = "Start";
        }

        function getPivotIndex(word) {
            const len = word.length;
            if (len === 1) return 0;
            return Math.floor((len - 1) / 2);
        }

        function renderWord(word) {
            if (!word) return;

            const pivotIndex = getPivotIndex(word);
            const leftPart = word.substring(0, pivotIndex);
            const pivotChar = word.substring(pivotIndex, pivotIndex + 1);
            const rightPart = word.substring(pivotIndex + 1);

            wLeft.innerText = leftPart;
            wPivot.innerText = pivotChar;
            wRight.innerText = rightPart;
        }

        function runLoop() {
            if (!isPlaying) return;

            if (currentIndex >= words.length) {
                pause();
                playPauseBtn.innerText = "Restart";
                return;
            }

            const word = words[currentIndex];
            renderWord(word);

            // 1. Calculate Standard Delay based on Speed
            let currentWPM = parseInt(speedSlider.value);
            if (isGradual) {
                const startWPM = parseInt(speedSlider.value);
                const endWPM = parseInt(endSpeedSlider.value);
                const progress = currentIndex / words.length;
                currentWPM = startWPM + (endWPM - startWPM) * progress;
            }
            let delay = 60000 / currentWPM;

            // 2. Adjust for Punctuation
            const lastChar = word.slice(-1);
            const isSentenceEnd = (lastChar === '.' || lastChar === '!' || lastChar === '?');
            const isClauseEnd = (lastChar === ',' || lastChar === ';' || lastChar === ':');

            if (isSentenceEnd) {
                const mode = pauseModeSelect.value;
                const val = parseFloat(pauseValueInput.value) || 0;

                if (mode === 'relative') {
                    delay = delay * val; // Multiplier
                } else {
                    // Constant mode: The word stays on screen for exactly X ms
                    // or delay + X? Usually "Constant Pause" implies fixed duration. 
                    // Let's treat it as the TOTAL time the word is visible.
                    delay = val; 
                }
            } else if (isClauseEnd) {
                // Clause pause remains standard (1.2x) to prevent over-complication
                delay = delay * 1.2; 
            }

            currentIndex++;
            timer = setTimeout(runLoop, delay);
        }

        // Initialize display
        processText();
        if(words.length > 0) renderWord(words[0]);

    </script>
</body>
</html>
