<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Reader Pro</title>
    <style>
        :root {
            /* Theme Variables */
            --bg-body: #050505;
            --bg-panel: #121212;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #4a90e2; 
            --accent-hover: #357abd;
            --pivot-color: #d32f2f; /* Default Red */
            --radius: 6px;
            --container-max: 900px;
        }

        /* Reset & Base */
        * { box-sizing: border-box; outline: none; }
        
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header */
        header {
            width: 100%;
            max-width: var(--container-max);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
        }

        h1 {
            font-weight: 200;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 22px;
            margin: 0;
            color: var(--text-secondary);
        }
        
        h1 span { color: var(--accent-color); font-weight: 400; }

        /* Layout */
        .app-container {
            width: 100%;
            max-width: var(--container-max);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Panel Styling */
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* 1. Text Input */
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0a0a0a;
            color: #ccc;
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            border-radius: 4px;
            font-family: inherit;
            transition: border 0.2s;
        }
        textarea:focus { border-color: var(--accent-color); }

        /* 2. Controls Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .control-group h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin: 0 0 15px 0;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Inputs */
        label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        select, input[type="number"], input[type="color"] {
            width: 100%;
            background: #1a1a1a;
            color: white;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        input[type="color"] { padding: 0; height: 34px; cursor: pointer; }
        
        /* Sliders */
        .slider-section { margin-top: 15px; }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .val-display { color: var(--accent-color); font-family: monospace; font-weight: bold; }

        .slider-stack {
            position: relative;
            height: 30px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: absolute;
            top: 5px;
            left: 0;
            pointer-events: none; 
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            pointer-events: auto; 
            margin-top: -6px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 0 2px var(--bg-panel); 
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
        }

        /* Checkbox */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            font-size: 12px;
            color: var(--text-primary);
            cursor: pointer;
        }
        input[type="checkbox"] { accent-color: var(--accent-color); cursor: pointer; }

        /* 3. Reader HUD */
        #reader-hud {
            width: 100%;
            height: 320px;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
        }

        /* --- UPDATED RETICLE STYLES --- */
        .reticle {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1; /* Behind text */
        }
        
        /* Vertical Notches stuck to edges */
        .reticle .notch {
            position: absolute;
            left: 50%;
            width: 1px;
            height: 25px; /* Slightly longer */
            background: #333;
            transform: translateX(-50%);
        }
        .notch-top { top: 0; }
        .notch-bottom { bottom: 0; }

        /* Horizontal Framing Lines */
        .reticle .guide-horiz {
            position: absolute;
            left: 2%; 
            right: 2%;
            height: 1px;
            /* Faint gradient, fades out completely in the center gap */
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.1) 100%);
        }
        /* Positioned above and below center to frame text */
        .guide-above { top: 38%; }
        .guide-below { bottom: 38%; }


        /* Word Display */
        .word-stage {
            position: relative;
            z-index: 10; /* In front of reticle */
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: baseline; 
            width: 100%;
            font-size: 52px;
            user-select: none;
            line-height: 1;
            padding-bottom: 4px; 
        }
        .w-left { text-align: right; color: var(--text-primary); }
        .w-pivot { 
            text-align: center; 
            font-weight: 600; 
            padding: 0 1px; 
            color: var(--pivot-color); 
        }
        .w-right { text-align: left; color: var(--text-primary); }

        /* HUD Stats */
        .hud-stat {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #555;
            pointer-events: none;
            z-index: 5;
        }
        .stat-wpm { bottom: 15px; right: 20px; }
        .stat-progress { bottom: 0; left: 0; height: 3px; background: var(--accent-color); width: 0%; transition: width 0.1s linear; }

        /* 4. Action Bar */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        button {
            padding: 14px 45px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        .btn-reset { background: #222; color: #888; }
        .btn-reset:hover { background: #333; color: white; }

        .btn-play { background: var(--accent-color); color: white; box-shadow: 0 4px 15px rgba(74, 144, 226, 0.2); }
        .btn-play:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-play:active { transform: translateY(1px); }

        /* Mobile Breakpoint */
        @media (max-width: 700px) {
            .dashboard { grid-template-columns: 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Speed Reader <span>Pro</span></h1>
    </header>

    <div class="app-container">
        
        <div class="panel">
            <textarea id="sourceText" placeholder="Paste your text here to begin reading...">Eye fatigue while reading often comes from the constant, repetitive motion our eyes are forced to make across a static page or screen. Each line requires a sequence of small jumps called saccades, punctuated by brief stops where the brain processes text. Over long periods, this back-and-forth motion strains the eye muscles, dries the eyes, and increases cognitive load as readers repeatedly lose their place, reorient, and refocus. The result is familiar to many readers: headaches, blurred vision, reduced focus, and a gradual decline in reading efficiency the longer a session lasts.
When the words move instead of the eyes, much of that physical strain is reduced. Techniques such as rapid serial visual presentation (RSVP) keep the text centered in a fixed focal point, allowing the eyes to remain relatively still while the brain does the work of processing language. By eliminating constant saccades and regressions, readers expend less energy on eye movement and more on comprehension. This can feel surprisingly natural after a short adjustment period, as the visual system shifts from navigation to absorption.
This change in mechanics can also improve both reading speed and understanding. With fewer interruptions from line breaks, page turns, or rereading lost spots, readers maintain a more consistent rhythm and cognitive flow. The brain receives information in a steady stream, which can enhance pattern recognition and reduce mental friction. For many readers, especially those prone to fatigue or distraction, moving text creates a smoother, more sustainable reading experience that supports faster intake without sacrificing comprehension.</textarea>
        </div>

        <div class="panel dashboard">
            
            <div class="control-group">
                <h3>Visual Settings</h3>
                <div class="grid-2">
                    <div>
                        <label>Font Family</label>
                        <select id="fontSelect">
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Inter', sans-serif">Inter (System)</option>
                            <option value="'Courier New', monospace">Courier New</option>
                            <option value="Georgia, serif">Georgia</option>
                            <option value="Verdana, sans-serif">Verdana</option>
                        </select>
                    </div>
                    <div>
                        </div>
                    <div>
                        <label>Text Color</label>
                        <input type="color" id="textColor" value="#ffffff">
                    </div>
                    <div>
                        <label>Pivot Color</label>
                        <input type="color" id="pivotColor" value="#d32f2f">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <h3>Timing & Playback</h3>
                <div class="grid-2">
                    <div>
                        <label>Pause Mode</label>
                        <select id="pauseMode">
                            <option value="relative">Relative (Multiplier)</option>
                            <option value="constant">Fixed (Milliseconds)</option>
                        </select>
                    </div>
                    <div>
                        <label>Value</label>
                        <input type="number" id="pauseValue" value="2.0" step="0.1">
                    </div>
                </div>

                <div class="slider-section">
                    <div class="slider-header">
                        <span>Reading Speed</span>
                        <span class="val-display" id="wpmReadout">200 → 800 WPM</span>
                    </div>
                    <div class="slider-stack">
                        <input type="range" id="speedMin" min="50" max="1500" value="200" step="10">
                        <input type="range" id="speedMax" min="50" max="1500" value="800" step="10">
                    </div>
                    <label class="checkbox-row">
                        <input type="checkbox" id="gradualToggle" checked>
                        Gradually increase speed
                    </label>
                </div>
            </div>
        </div>

        <div id="reader-hud">
            <div class="reticle">
                <div class="notch notch-top"></div>
                <div class="notch notch-bottom"></div>
                <div class="guide-horiz guide-above"></div>
                <div class="guide-horiz guide-below"></div>
            </div>

            <div class="word-stage">
                <span class="w-left" id="d-left">Speed</span>
                <span class="w-pivot" id="d-pivot">R</span>
                <span class="w-right" id="d-right">eader</span>
            </div>

            <div class="hud-stat stat-wpm" id="live-wpm">READY</div>
            <div class="hud-stat stat-progress" id="progress-bar"></div>
        </div>

        <div class="action-bar">
            <button class="btn-reset" onclick="app.reset()">Reset (Esc)</button>
            <button class="btn-play" id="btn-play" onclick="app.togglePlay()">Start Reading (Space)</button>
        </div>

    </div>

    <script>
        /**
         * Speed Reader Pro - Gold Master
         */
        class SpeedReader {
            constructor() {
                // DOM Cache
                this.el = {
                    text: document.getElementById('sourceText'),
                    left: document.getElementById('d-left'),
                    pivot: document.getElementById('d-pivot'),
                    right: document.getElementById('d-right'),
                    wpmLabel: document.getElementById('wpmReadout'),
                    liveWpm: document.getElementById('live-wpm'),
                    progress: document.getElementById('progress-bar'),
                    playBtn: document.getElementById('btn-play'),
                    minSlide: document.getElementById('speedMin'),
                    maxSlide: document.getElementById('speedMax'),
                    gradual: document.getElementById('gradualToggle'),
                    font: document.getElementById('fontSelect'),
                    cText: document.getElementById('textColor'),
                    cPivot: document.getElementById('pivotColor'),
                    pMode: document.getElementById('pauseMode'),
                    pValue: document.getElementById('pauseValue'),
                    stage: document.querySelector('.word-stage')
                };

                // Internal State
                this.queue = [];
                this.index = 0;
                this.isPlaying = false;
                this.timer = null;
                this.isGradual = true;
                this.expectedTime = 0;

                this.initEvents();
                this.applyInitialColors(); 
                this.updateSettingsUI();
            }

            initEvents() {
                // UI Controls
                this.el.minSlide.addEventListener('input', () => this.updateSettingsUI());
                this.el.maxSlide.addEventListener('input', () => this.updateSettingsUI());
                this.el.gradual.addEventListener('change', (e) => {
                    this.isGradual = e.target.checked;
                    this.el.maxSlide.style.display = this.isGradual ? 'block' : 'none';
                    this.updateSettingsUI();
                });

                // Style Updates
                this.el.cText.addEventListener('input', e => {
                    this.el.left.style.color = e.target.value;
                    this.el.right.style.color = e.target.value;
                });
                
                // UPDATE CSS VAR for Pivot Color
                this.el.cPivot.addEventListener('input', e => {
                    document.documentElement.style.setProperty('--pivot-color', e.target.value);
                });

                this.el.font.addEventListener('change', e => this.el.stage.style.fontFamily = e.target.value);

                // Pause Mode Defaults
                this.el.pMode.addEventListener('change', e => {
                    if(e.target.value === 'relative') {
                        this.el.pValue.value = "2.0";
                        this.el.pValue.step = "0.1";
                    } else {
                        this.el.pValue.value = "400";
                        this.el.pValue.step = "50";
                    }
                });

                // Keyboard Shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePlay();
                    }
                    if (e.code === 'Escape') {
                        e.preventDefault();
                        this.reset();
                    }
                });
            }

            // Ensures the color picker value is applied to the CSS variable on load
            applyInitialColors() {
                const pivotHex = this.el.cPivot.value;
                document.documentElement.style.setProperty('--pivot-color', pivotHex);
                
                const textHex = this.el.cText.value;
                this.el.left.style.color = textHex;
                this.el.right.style.color = textHex;
            }

            updateSettingsUI() {
                const min = parseInt(this.el.minSlide.value);
                const max = parseInt(this.el.maxSlide.value);
                this.el.wpmLabel.innerText = this.isGradual ? `${min} → ${max} WPM` : `${min} WPM`;
            }

            processText() {
                const raw = this.el.text.value;
                const words = raw.trim().split(/[\s\n]+/);

                this.queue = words.map(word => {
                    const len = word.length;
                    const pivotIdx = len === 1 ? 0 : Math.floor((len - 1) / 2);
                    
                    let dType = 'std';
                    const last = word.slice(-1);
                    if (['.', '!', '?'].includes(last)) dType = 'sent';
                    else if ([',', ';', ':', '—', '-'].includes(last)) dType = 'clause';

                    return {
                        left: word.substring(0, pivotIdx),
                        pivot: word.substring(pivotIdx, pivotIdx + 1),
                        right: word.substring(pivotIdx + 1),
                        type: dType
                    };
                });
            }

            togglePlay() {
                this.isPlaying ? this.pause() : this.start();
            }

            start() {
                if (this.queue.length === 0) this.processText();
                if (this.queue.length === 0) return;
                
                if (this.index >= this.queue.length) this.index = 0;

                this.isPlaying = true;
                this.el.playBtn.innerText = "PAUSE";
                this.el.playBtn.style.background = "#d32f2f"; 
                
                this.expectedTime = Date.now();
                this.tick();
            }

            pause() {
                this.isPlaying = false;
                clearTimeout(this.timer);
                this.el.playBtn.innerText = "RESUME";
                this.el.playBtn.style.background = ""; 
            }

            reset() {
                this.pause();
                this.index = 0;
                this.processText();
                if(this.queue.length > 0) this.render(this.queue[0]);
                this.el.playBtn.innerText = "START READING";
                this.el.liveWpm.innerText = "READY";
                this.el.progress.style.width = "0%";
            }

            render(item) {
                this.el.left.textContent = item.left;
                this.el.pivot.textContent = item.pivot;
                this.el.right.textContent = item.right;
            }

            tick() {
                if (!this.isPlaying) return;

                if (this.index >= this.queue.length) {
                    this.pause();
                    this.el.playBtn.innerText = "RESTART";
                    this.el.liveWpm.innerText = "DONE";
                    this.el.progress.style.width = "100%";
                    return;
                }

                const item = this.queue[this.index];
                this.render(item);

                // --- WPM Calc ---
                let currentWPM = parseInt(this.el.minSlide.value);
                if (this.isGradual) {
                    const min = parseInt(this.el.minSlide.value);
                    const max = parseInt(this.el.maxSlide.value);
                    const pct = this.index / this.queue.length;
                    currentWPM = min + (max - min) * pct;
                }

                this.el.liveWpm.innerText = Math.round(currentWPM) + " wpm";
                const progressPct = ((this.index + 1) / this.queue.length) * 100;
                this.el.progress.style.width = `${progressPct}%`;

                // --- Delay Calc ---
                let delay = 60000 / currentWPM;

                if (item.type === 'sent') {
                    const val = parseFloat(this.el.pValue.value) || 0;
                    delay = (this.el.pMode.value === 'relative') ? delay * val : val;
                } else if (item.type === 'clause') {
                    delay *= 1.2;
                }

                // --- Drift Correction ---
                const now = Date.now();
                const drift = now - this.expectedTime;
                if (drift > delay) this.expectedTime = now;
                this.expectedTime += delay;
                const nextDelay = Math.max(0, delay - drift);

                this.index++;
                this.timer = setTimeout(() => this.tick(), nextDelay);
            }
        }

        const app = new SpeedReader();
    </script>
</body>
</html>
